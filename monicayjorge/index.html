<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0e131d">
<title>Mónica & Jorge · German Weber Photography</title>
<meta name="description" content="Matrimonio de Mónica y Jorge, 3 de octubre de 2026.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://germanweber.cl/monicayjorge/">
<meta property="og:title" content="Mónica & Jorge">
<meta property="og:description" content="3 de octubre de 2026 · German Weber Photography">
<meta property="og:image" content="https://fotos.germanweber.cl/monicayjorge/web/0419.jpg">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/images/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="preconnect" href="https://fotos.germanweber.cl">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Misma atmósfera del adelanto: azul marino del uniforme, marfil del vestido, bronce de los galones. */
:root{
  --bg:#0e131d; --panel:#151c29; --fg:#efe9dd; --muted:#a3a9b5; --line:#263043; --brass:#c9a861; --brass-ink:#1a1408;
  --display:"Marcellus","Cormorant Garamond",Georgia,serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease-out:cubic-bezier(.22,1,.36,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);margin:0}
body{color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body.intro{overflow:hidden}

/* ---------- Portada: aquí corre la intro ---------- */
.hero{position:relative;height:100vh;height:100svh;overflow:hidden;background:#05070b}
.stage{position:absolute;inset:0}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;user-select:none;-webkit-user-drag:none}
.stage img.on{opacity:1}
.stage img.final{opacity:1;object-position:var(--pos,50% 50%);transform:scale(1.06);transition:transform 6s var(--ease-out)}
body.listo .stage img.final{transform:scale(1)}
.veil{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.2s ease;
  background:linear-gradient(180deg,rgba(5,7,11,.15) 0%,rgba(5,7,11,0) 35%,rgba(5,7,11,.25) 60%,rgba(14,19,29,.92) 100%)}
.titulo{position:absolute;left:0;right:0;bottom:0;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 4vh + 52px);
  display:grid;gap:14px;justify-items:center;text-align:center}
.titulo>*{opacity:0;transform:translateY(14px);transition:opacity .9s ease,transform 1.1s var(--ease-out)}
.titulo .date{transition-delay:.18s}
body.nombres .veil{opacity:1}
body.nombres .titulo>*{opacity:1;transform:none}
h1{font-family:var(--display);font-weight:400;font-size:clamp(42px,7.5vw,92px);line-height:1;margin:0;letter-spacing:.01em;text-shadow:0 2px 30px rgba(0,0,0,.45)}
h1 .amp{color:var(--brass);font-size:.8em;padding-inline:.12em}
.date{font-family:var(--display);font-size:clamp(17px,2.4vw,22px);color:#d9d5cc;letter-spacing:.08em}
/* flecha que lleva a la galería */
.flecha{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 2.2vh);z-index:2;display:block;padding:11px;margin-left:-24px;
  color:#fff;background:none;border:0;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .8s ease}
.flecha svg{display:block;animation:flota 2.6s ease-in-out infinite}
body.listo .flecha{opacity:.6;pointer-events:auto}
@media (hover:hover) and (pointer:fine){body.listo .flecha:hover{opacity:.95}}
.flecha:focus-visible{outline:2px solid var(--brass);outline-offset:3px;border-radius:999px}
@keyframes flota{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
.loader{position:absolute;left:50%;top:50%;width:120px;height:1px;margin-left:-60px;background:rgba(255,255,255,.12);overflow:hidden;transition:opacity .4s}
.loader i{display:block;height:100%;width:0;background:var(--brass);transition:width .2s linear}
.loader.fuera{opacity:0}

/* ---------- Botón de descarga ---------- */
.acciones{display:flex;justify-content:center;padding:28px 16px 0}
.acciones[hidden]{display:none}
.btn{font:inherit;font-weight:600;font-size:13px;border-radius:999px;padding:9px 16px;cursor:pointer;border:1px solid var(--brass);background:var(--brass);color:var(--brass-ink);display:inline-flex;gap:8px;align-items:center;text-decoration:none;white-space:nowrap;transition:transform .15s var(--ease-out),filter .2s}
.btn[hidden]{display:none}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.6;cursor:default}
@media (hover:hover){.btn:hover{filter:brightness(1.08)}}
.btn:focus-visible,.tile:focus-visible,.lb button:focus-visible{outline:2px solid var(--brass);outline-offset:3px}

/* ---------- Galería ---------- */
main{max-width:1400px;margin-inline:auto;padding:36px 16px 0}
.row{display:flex;flex-wrap:wrap;gap:8px}
.row::after{content:"";flex-grow:999}
.tile{position:relative;display:block;padding:0;border:0;background:var(--panel);cursor:zoom-in;overflow:hidden;border-radius:2px;max-width:100%;
  opacity:0;transform:translateY(18px) scale(.985)}
main.visible .tile{opacity:1;transform:none;transition:opacity .7s ease var(--d,0ms),transform .9s var(--ease-out) var(--d,0ms)}
.tile img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease-out),opacity .5s ease}
.tile img:not(.ok){opacity:0}
@media (hover:hover){.tile:hover img{transform:scale(1.025)}}
footer{max-width:1400px;margin:64px auto 0;padding:22px 16px calc(env(safe-area-inset-bottom,0px) + 40px);border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}
footer b{font-family:var(--display);font-weight:400;color:var(--fg);font-size:16px;letter-spacing:.04em}
footer a{color:inherit}
footer b a{text-decoration:none}
.otra{font:inherit;font-size:13px;color:var(--muted);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* ---------- Visor ---------- */
.lb{position:fixed;inset:0;background:rgba(6,9,14,.97);display:grid;grid-template-rows:auto 1fr auto;z-index:10;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 12px);opacity:0;transition:opacity .25s ease}
.lb.visible{opacity:1}
.lb[hidden]{display:none!important}
.lb-top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-inline:4px}
.lb-stage{position:relative;display:flex;align-items:center;justify-content:center;min-height:0;touch-action:pan-y}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;transition:opacity .2s ease}
.lb-stage img.cargando{opacity:.35}
.lb button{font:inherit;background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:999px;cursor:pointer}
.lb .close{padding:7px 15px}
.lb .nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;font-size:22px;line-height:1;background:rgba(14,19,29,.6)}
.lb .prev{left:4px}.lb .next{right:4px}
.lb-bottom{display:flex;justify-content:center;gap:12px;align-items:center;flex-wrap:wrap;padding-top:10px}
.lb .btn{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.status{font-size:13px;color:var(--muted);min-height:1.4em;font-variant-numeric:tabular-nums}
@media (max-width:600px){.lb .nav{display:none}.row{gap:5px}main{padding-top:24px}}

@media (prefers-reduced-motion:reduce){
  .stage img.final,.tile,.tile img,.titulo>*,.veil,.flecha{transition:none!important}
  .flecha svg{animation:none}
  .stage img.final{transform:none}
}
</style>
</head>
<body class="intro">

<header class="hero" id="hero">
  <div class="stage" id="stage" aria-hidden="true"></div>
  <div class="veil"></div>
  <div class="loader" id="loader"><i id="loaderBar"></i></div>
  <div class="titulo">
    <h1>Mónica<span class="amp">&amp;</span>Jorge</h1>
    <div class="date">3 de octubre de 2026</div>
  </div>
  <button class="flecha" id="flecha" type="button" aria-label="Ver las fotos">
    <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M5 9l7 7 7-7" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</header>

<div class="acciones" id="acciones" hidden><a class="btn" id="zipBtn" target="_blank" rel="noopener">↓ Descargar todas en alta resolución</a></div>

<main id="galeria"><div class="row" id="gallery"></div></main>

<footer>
  <b><a href="https://germanweber.cl">German Weber Photography</a></b>
  <button class="otra" id="otraVez" type="button">Ver la entrada otra vez</button>
  <a href="https://www.instagram.com/germanicolas/" rel="noopener">Instagram @germanicolas</a>
</footer>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Foto en grande">
  <div class="lb-top"><span id="lbCount"></span><button class="close" id="lbClose" type="button">Cerrar ✕</button></div>
  <div class="lb-stage" id="lbStage">
    <button class="nav prev" id="lbPrev" type="button" aria-label="Anterior">‹</button>
    <img id="lbImg" alt="">
    <button class="nav next" id="lbNext" type="button" aria-label="Siguiente">›</button>
  </div>
  <div class="lb-bottom"><button class="btn" id="lbDl" type="button">Descargar en alta resolución</button><span class="status" id="lbStatus" role="status" aria-live="polite"></span></div>
</div>

<script src="datos.js?v=2"></script>
<script>
// Fotos en Cloudflare R2: thumb 600 px (grilla), web 1600 px (visor e intro), full 4000 px (descarga)
const FOTOS = "https://fotos.germanweber.cl/monicayjorge";
const DRIVE = "https://drive.google.com/drive/folders/1R0F-wuCVHcqHmIcGeWaf2CQMBfarT8ZY";   // carpeta de Drive (germanicolas, Matrimonios/Monica&Jorge) con todas en alta resolución; vacío = botón oculto
const PORTADA_POS = "50% 30%";   // encuadre de la portada: caras arriba, nombres abajo
const NOMBRE = "Mónica y Jorge";

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(4, "0");
const SRC = {thumb: n => `${FOTOS}/thumb/${pad(n)}.jpg`, web: n => `${FOTOS}/web/${pad(n)}.jpg`, full: n => `${FOTOS}/full/${pad(n)}.jpg`};
const TOTAL = DATOS.total;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
if (DRIVE) { $("zipBtn").href = DRIVE; $("acciones").hidden = false; }

// ---------- Galería: todas seguidas, en orden del día ----------
const gal = $("gallery");
const frag = document.createDocumentFragment();
for (let n = 1; n <= TOTAL; n++) {
  const r = DATOS.ratios[n - 1];
  const t = document.createElement("button");
  t.className = "tile"; t.type = "button";
  t.style.flex = `${r} 1 ${Math.round(r * 250)}px`; t.style.aspectRatio = r;
  if (n <= 24) t.style.setProperty("--d", `${(n - 1) * 45 + 250}ms`);
  t.setAttribute("aria-label", `Ver foto ${n}`);
  const img = new Image();
  img.alt = `Foto ${n} del matrimonio de Mónica y Jorge`; img.loading = "lazy"; img.decoding = "async";
  img.onload = () => img.classList.add("ok");
  img.src = SRC.thumb(n);
  t.appendChild(img);
  t.addEventListener("click", () => openLb(n));
  frag.appendChild(t);
}
gal.appendChild(frag);

// ---------- Intro: fotos rápidas que aceleran y frenan en la portada ----------
const stage = $("stage");
function cargar(src) {
  return new Promise(res => { const im = new Image(); im.decoding = "async"; im.onload = im.onerror = () => res(im); im.src = src; });
}
// duración de cada cuadro: entra lento, acelera hasta ~70 ms y frena antes de la portada
function tiempos(k) {
  return Array.from({length: k}, (_, i) => {
    const t = i / Math.max(k - 1, 1);
    if (t < .35) return 300 - (t / .35) * 230;
    if (t < .8)  return 70;
    return 70 + ((t - .8) / .2) ** 2 * 260;
  });
}
const espera = ms => new Promise(r => setTimeout(r, ms));

async function intro(completa) {
  document.body.classList.remove("listo", "nombres");
  document.body.classList.add("intro");
  scrollTo(0, 0);
  stage.innerHTML = "";
  const lista = completa && !reduce ? DATOS.intro : [];
  const loader = $("loader"), bar = $("loaderBar");
  loader.classList.remove("fuera");
  let hechas = 0;
  const tick = () => { bar.style.width = `${(++hechas / (lista.length + 1)) * 100}%`; };
  const imgs = {};
  await Promise.all([
    ...lista.map(n => cargar(SRC.web(n)).then(im => { imgs[n] = im; tick(); })),
    cargar(SRC.web(DATOS.portada)).then(im => { imgs.portada = im; tick(); }),
  ]);
  // decodificar antes de partir para que no tiritee; con tope, porque algunos navegadores no resuelven decode()
  await Promise.race([
    Promise.all(Object.values(imgs).map(im => im.decode ? im.decode().catch(() => {}) : null)),
    espera(1500),
  ]);
  loader.classList.add("fuera");
  Object.values(imgs).forEach(im => { im.alt = ""; stage.appendChild(im); });

  const ts = tiempos(lista.length);
  let prev = null;
  for (let i = 0; i < lista.length; i++) {
    const im = imgs[lista[i]];
    if (prev) prev.classList.remove("on");
    im.classList.add("on"); prev = im;
    await espera(ts[i]);
  }
  if (prev) prev.classList.remove("on");
  imgs.portada.style.setProperty("--pos", PORTADA_POS);
  imgs.portada.classList.add("final");
  await espera(reduce ? 0 : 450);
  document.body.classList.add("nombres");
  await espera(reduce ? 0 : 1500);
  document.body.classList.remove("intro");
  document.body.classList.add("listo");
}
// la intro pasa cada vez que se abre o se refresca la página, siempre desde arriba
if ("scrollRestoration" in history) history.scrollRestoration = "manual";
intro(true);
$("otraVez").addEventListener("click", () => { $("galeria").classList.remove("visible"); intro(true); });

// ---------- De la portada a la galería: flecha, rueda, deslizar o teclado ----------
const hero = $("hero");
let yendo = false;
function ir(y) {
  if (yendo) return;
  yendo = true;
  scrollTo({top: y, behavior: reduce ? "auto" : "smooth"});
  setTimeout(() => { yendo = false; }, 900);
}
const inicioGaleria = () => ($("acciones").hidden ? $("galeria") : $("acciones")).offsetTop;
const enPortada = () => document.body.classList.contains("listo") && lb.hidden && scrollY < hero.offsetHeight - 2;
$("flecha").addEventListener("click", () => ir(inicioGaleria()));
addEventListener("wheel", e => {
  if (!enPortada()) return;
  if (e.deltaY > 0) { e.preventDefault(); ir(inicioGaleria()); }
  else if (e.deltaY < 0 && scrollY > 0) { e.preventDefault(); ir(0); }
}, {passive: false});
let ty = null;
hero.addEventListener("touchstart", e => { ty = e.touches[0].clientY; }, {passive: true});
hero.addEventListener("touchmove", e => { if (enPortada() && scrollY < 2) e.preventDefault(); }, {passive: false});
hero.addEventListener("touchend", e => {
  if (ty === null || !enPortada()) return;
  if (ty - e.changedTouches[0].clientY > 30) ir(inicioGaleria());
  ty = null;
});
addEventListener("keydown", e => {
  if (enPortada() && ["ArrowDown", "PageDown", " "].includes(e.key) && document.activeElement?.tagName !== "BUTTON") {
    e.preventDefault(); ir(inicioGaleria());
  }
});
// la cascada de fotos parte cuando la galería aparece en pantalla
new IntersectionObserver((es, o) => es.forEach(e => {
  if (e.isIntersecting && document.body.classList.contains("listo")) { e.target.classList.add("visible"); }
}), {rootMargin: "0px 0px -15% 0px"}).observe($("galeria"));   // sin threshold: la galería es mucho más alta que la pantalla

// ---------- Visor ----------
let cur = 1, ultimoFoco = null;
const lb = $("lb"), img = $("lbImg");
function show(n) {
  cur = ((n - 1 + TOTAL) % TOTAL) + 1;
  img.classList.add("cargando");
  img.onload = () => img.classList.remove("cargando");
  img.src = SRC.web(cur); img.alt = `Foto ${cur} del matrimonio de Mónica y Jorge`;
  $("lbCount").textContent = `${cur} / ${TOTAL}`;
  $("lbStatus").textContent = "";
  new Image().src = SRC.web(cur % TOTAL + 1);
}
function openLb(n) {
  ultimoFoco = document.activeElement;
  show(n); lb.hidden = false; document.body.style.overflow = "hidden";
  requestAnimationFrame(() => lb.classList.add("visible")); $("lbClose").focus();
}
function closeLb() {
  lb.classList.remove("visible"); document.body.style.overflow = "";
  setTimeout(() => { lb.hidden = true; }, 180); ultimoFoco?.focus();
}
$("lbClose").onclick = closeLb; $("lbPrev").onclick = () => show(cur - 1); $("lbNext").onclick = () => show(cur + 1);
lb.addEventListener("click", e => { if (e.target === lb || e.target.id === "lbStage") closeLb(); });
document.addEventListener("keydown", e => {
  if (lb.hidden) return;
  if (e.key === "Escape") closeLb(); else if (e.key === "ArrowLeft") show(cur - 1); else if (e.key === "ArrowRight") show(cur + 1);
});
let sx = null;
$("lbStage").addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, {passive: true});
$("lbStage").addEventListener("touchend", e => {
  if (sx === null) return; const dx = e.changedTouches[0].clientX - sx;
  if (Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1)); sx = null;
});
// Descarga: las fotos están en otro dominio, así que se bajan como blob para que el navegador las guarde con nombre
$("lbDl").addEventListener("click", async () => {
  const n = cur, b = $("lbDl"), st = $("lbStatus");
  b.disabled = true; st.textContent = "Bajando…";
  try {
    const r = await fetch(SRC.full(n));
    if (!r.ok) throw new Error(r.status);
    const url = URL.createObjectURL(await r.blob());
    const a = document.createElement("a");
    a.href = url; a.download = `${NOMBRE} - ${pad(n)}.jpg`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    st.textContent = "";
  } catch (e) {
    window.open(SRC.full(n), "_blank", "noopener");
    st.textContent = "";
  } finally { b.disabled = false; }
});
</script>
